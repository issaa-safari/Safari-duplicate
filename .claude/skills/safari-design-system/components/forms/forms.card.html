<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; font-family: var(--font-body); background: #fff; padding: 24px 28px; }
  .section { margin-bottom: 22px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); margin-bottom: 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, Field, TextareaField, SelectField, Toggle, Checkbox, Radio } = window.SafariAdventureRidersDesignSystem_473602;

function Demo() {
  const [toggle, setToggle] = React.useState(true);
  const [check, setCheck] = React.useState(true);
  const [trail, setTrail] = React.useState('bike');
  return (
    <div>
      <div className="section">
        <div className="lbl">Buttons</div>
        <div className="row">
          <Button variant="primary" size="md">Request a Quote</Button>
          <Button variant="secondary" size="md">Cancel</Button>
          <Button variant="ghost" size="sm">Details</Button>
          <Button variant="danger" size="sm">Delete</Button>
          <Button variant="primary" size="md" disabled>Disabled</Button>
        </div>
      </div>
      <div className="section">
        <div className="lbl">Fields</div>
        <div className="row" style={{alignItems:'flex-start'}}>
          <div style={{width:220}}><Field label="Full name" placeholder="Jane Traveller" required /></div>
          <div style={{width:220}}><Field label="Email" placeholder="you@example.com" error="Enter a valid email" /></div>
          <div style={{width:220}}>
            <SelectField label="Tour type"><option>Group Bike Tour</option><option>Private Safari</option></SelectField>
          </div>
        </div>
      </div>
      <div className="section">
        <div className="lbl">Toggle · Checkbox · Radio</div>
        <div className="row">
          <Toggle checked={toggle} onChange={setToggle} label="Show on public site" />
          <Checkbox checked={check} onChange={setCheck} label="I agree to the terms" />
          <Radio name="trail" checked={trail==='bike'} onChange={() => setTrail('bike')} label="Bike" />
          <Radio name="trail" checked={trail==='private'} onChange={() => setTrail('private')} label="Private" />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
