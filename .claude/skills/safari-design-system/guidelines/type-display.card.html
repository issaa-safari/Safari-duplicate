<!-- @dsCard group="Type" viewport="700x260" name="Display — Readex Pro" subtitle="Headings · bold 700 · fluid clamp scale" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-display); background: #fff; color: var(--text-heading); padding: 24px 28px; }
  .hero { font-size: 3rem; font-weight: 700; line-height: var(--lh-tight); letter-spacing: var(--ls-tight); margin: 0; }
  .h2 { font-size: 2rem; font-weight: 700; margin: 14px 0 0; }
  .h3 { font-size: 1.4rem; font-weight: 700; margin: 10px 0 0; }
  .lbl { font-family: var(--font-body); font-size: 11px; color: var(--text-muted); letter-spacing: var(--ls-wide); text-transform: uppercase; margin-top: 4px; }
</style>
</head>
<body>
  <p class="hero">Ride the Bush.</p>
  <div class="lbl">Hero · clamp(2.4rem → 5rem) · 700</div>
  <p class="h2">Choose Your Trail</p>
  <div class="lbl">Section H2 · clamp(1.4rem → 2rem)</div>
  <p class="h3">Why book direct?</p>
  <div class="lbl">Card H3 · 700</div>
</body>
</html>
