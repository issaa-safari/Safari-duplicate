<!-- @dsCard group="Colors" viewport="700x150" name="Brand — Olive" subtitle="Master brand green · primary CTA & active states" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: #fff; }
  .row { display: flex; gap: 14px; padding: 20px; }
  .sw { flex: 1; border-radius: var(--radius-lg); border: var(--border-card); overflow: hidden; }
  .chip { height: 78px; }
  .meta { padding: 8px 12px; }
  .name { font-size: 13px; font-weight: 700; color: var(--text-heading); }
  .hex { font-family: var(--font-mono); font-size: 12px; color: var(--text-body); text-transform: uppercase; }
  .role { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--olive)"></div><div class="meta"><div class="name">Olive</div><div class="hex">#7A9A4A</div><div class="role">Primary / CTA</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--olive-dk)"></div><div class="meta"><div class="name">Olive Dark</div><div class="hex">#3D5229</div><div class="role">Hover / pressed</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--olive-lt)"></div><div class="meta"><div class="name">Olive Light</div><div class="hex">#C5D9B0</div><div class="role">Tint / border</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--olive-tint)"></div><div class="meta"><div class="name">Olive Tint</div><div class="hex">#EEF3E5</div><div class="role">Faint wash</div></div></div>
  </div>
</body>
</html>
