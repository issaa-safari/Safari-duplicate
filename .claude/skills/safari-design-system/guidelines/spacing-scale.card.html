<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: #fff; padding: 24px 28px; }
  .row { display: flex; align-items: flex-end; gap: 18px; }
  .u { text-align: center; }
  .bar { background: var(--olive); border-radius: 3px; width: 100%; }
  .l { font-family: var(--font-mono); font-size: 11px; color: var(--text-body); margin-top: 8px; }
</style>
</head>
<body>
  <div class="row">
    <div class="u" style="width:28px"><div class="bar" style="height:4px"></div><div class="l">4</div></div>
    <div class="u" style="width:28px"><div class="bar" style="height:8px"></div><div class="l">8</div></div>
    <div class="u" style="width:28px"><div class="bar" style="height:12px"></div><div class="l">12</div></div>
    <div class="u" style="width:28px"><div class="bar" style="height:16px"></div><div class="l">16</div></div>
    <div class="u" style="width:32px"><div class="bar" style="height:24px"></div><div class="l">24</div></div>
    <div class="u" style="width:36px"><div class="bar" style="height:32px"></div><div class="l">32</div></div>
    <div class="u" style="width:44px"><div class="bar" style="height:48px"></div><div class="l">48</div></div>
    <div class="u" style="width:52px"><div class="bar" style="height:64px"></div><div class="l">64</div></div>
    <div class="u" style="width:60px"><div class="bar" style="height:80px"></div><div class="l">80</div></div>
  </div>
</body>
</html>
