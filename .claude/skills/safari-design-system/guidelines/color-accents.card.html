<!-- @dsCard group="Colors" viewport="700x150" name="Trail accents" subtitle="Murram = bike tours · Gold = private safari" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: #fff; }
  .row { display: flex; gap: 14px; padding: 20px; }
  .sw { flex: 1; border-radius: var(--radius-lg); border: var(--border-card); overflow: hidden; }
  .chip { height: 78px; display: flex; align-items: flex-end; padding: 10px; }
  .tag { font-size: 10px; font-weight: 700; letter-spacing: var(--ls-eyebrow); text-transform: uppercase; color: #fff; }
  .meta { padding: 8px 12px; }
  .name { font-size: 13px; font-weight: 700; color: var(--text-heading); }
  .hex { font-family: var(--font-mono); font-size: 12px; color: var(--text-body); text-transform: uppercase; }
  .role { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--murram)"><span class="tag">Ride the Bush</span></div><div class="meta"><div class="name">Murram</div><div class="hex">#B0492B</div><div class="role">Group bike tours</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--gold)"><span class="tag">Drive the Wild</span></div><div class="meta"><div class="name">Gold</div><div class="hex">#C9A24B</div><div class="role">Private safari</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--whatsapp)"><span class="tag">Chat on WhatsApp</span></div><div class="meta"><div class="name">WhatsApp</div><div class="hex">#25D366</div><div class="role">Brand — never restyle</div></div></div>
  </div>
</body>
</html>
