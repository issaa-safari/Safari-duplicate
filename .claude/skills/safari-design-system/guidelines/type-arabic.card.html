<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body-ar); background: #fff; padding: 24px 28px; }
  .h { font-family: var(--font-body-ar); font-size: 2rem; font-weight: 700; color: var(--text-heading); margin: 0; }
  .b { font-size: 1.05rem; line-height: 1.9; color: var(--text-body); margin: 12px 0 0; max-width: 54ch; }
  .lbl { font-family: var(--font-body); font-size: 11px; color: var(--text-muted); letter-spacing: var(--ls-wide); text-transform: uppercase; margin-top: 10px; direction: ltr; text-align: right; }
</style>
</head>
<body>
  <p class="h">اختر مسارك</p>
  <p class="b">جولات دراجات جماعية وسفاري خاصة في كينيا وشرق أفريقيا — مُصممة لمن يطلب أكثر من مجرد رحلة سياحية.</p>
  <p class="lbl">IBM Plex Sans Arabic · dir="rtl"</p>
</body>
</html>
